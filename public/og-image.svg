<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff3388"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="180" r="280" fill="#00f2fe" opacity="0.12" filter="blur(80px)"/>
  <circle cx="950" cy="420" r="280" fill="#ff3388" opacity="0.12" filter="blur(80px)"/>

  <!-- Logo Mark -->
  <rect x="120" y="140" width="100" height="100" rx="28" fill="url(#glow)"/>
  <text x="170" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle">Z</text>

  <!-- Texts -->
  <text x="120" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="64" font-weight="900" fill="#f1f5f9" letter-spacing="-1">ZAKOWAY HUB</text>
  <text x="120" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="34" font-weight="700" fill="#00f2fe">扎口动漫 在线播放 · zakoway 客户端下载</text>
  <text x="120" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">多源聚合 · 实时弹幕 · WebGPU 画质超分 · 智能跳过 OP/ED · 新番周表</text>

  <!-- Badges -->
  <g transform="translate(120, 480)">
    <rect width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="80" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#00f2fe" text-anchor="middle">⚡ Web 网页端</text>
  </g>
  <g transform="translate(300, 480)">
    <rect width="180" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="90" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ff3388" text-anchor="middle">📱 Android / iOS</text>
  </g>
  <g transform="translate(500, 480)">
    <rect width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="80" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#10b981" text-anchor="middle">🟢 官方发布源</text>
  </g>
</svg>
